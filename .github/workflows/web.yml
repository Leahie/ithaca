name: web

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/schema/**'
      - 'fixtures/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web.yml'

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
      - run: pnpm install --frozen-lockfile
      # I-G5: the committed TS types match the pydantic models.
      - run: pnpm schema:check
      - run: pnpm typecheck
      - run: pnpm test
