<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Defurnished house</title>
<style>
  :root { --bg: #f4f1ec; --panel: rgba(255,255,255,.92); --ink: #1d1b18; --muted: #6b665e; --accent: #b4532a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.35 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #ui { position: fixed; top: 12px; left: 12px; background: var(--panel); border-radius: 10px; padding: 10px 12px;
        box-shadow: 0 2px 12px rgba(0,0,0,.12); display: grid; gap: 8px; max-width: 300px; }
  #ui h1 { font-size: 14px; margin: 0; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  button, select { font: inherit; border: 1px solid #d6d0c6; background: #fff; border-radius: 6px; padding: 4px 8px; cursor: pointer; }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  #hint { color: var(--muted); font-size: 12px; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }
</style>
</head>
<body>
<div id="ui">
  <h1 id="title">Defurnished interior</h1>
  <div class="row">
    <button id="m-defurn" class="on">Defurnished shell</button>
    <button id="m-furn">Scanned (furnished)</button>
  </div>
  <div class="row">
    Floor <button data-floor="0">1</button><button data-floor="1">2</button><button data-floor="all" class="on">Both</button>
  </div>
  <div class="row">
    <button id="ceiling">Ceiling</button>
    <button id="dots" class="on">Scan points</button>
    <button id="overview">Overview</button>
  </div>
  <div class="row">
    <select id="room"><option value="">Stand in a room…</option></select>
  </div>
  <div id="hint">Overview: drag to orbit, scroll to zoom. Click a scan point (orange dot) to stand there and drag to look around; ← → step between scan points in the room.</div>
</div>
<div id="status">Loading…</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.localClippingEnabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9e4dc);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.02, 500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const clip = new THREE.Plane(new THREE.Vector3(0, -1, 0), 1e6); // keeps y < constant
const floorCut = { 0: [-5, 2.55], 1: [2.55, 1e6], all: [-1e6, 1e6] };
const clipLow = new THREE.Plane(new THREE.Vector3(0, 1, 0), 1e6);  // keeps y > constant

// show the photos as they are: unlit, one side
function unlit(root, doubleSided) {
  root.traverse((o) => {
    if (!o.isMesh) return;
    const old = o.material;
    o.material = new THREE.MeshBasicMaterial({ map: old.map, side: doubleSided ? THREE.DoubleSide : THREE.FrontSide,
                                               clippingPlanes: [clip, clipLow] });
    if (o.material.map) { o.material.map.colorSpace = THREE.SRGBColorSpace; o.material.map.anisotropy = 8; }
    old.dispose?.();
  });
}

// Built by `python -m services.api.twin.defurnished build <pid>`; serve the repo root:
//   python -m http.server 8765  ->  /services/api/twin/static/defurnished.html?pid=<pid>
const pid = new URLSearchParams(location.search).get('pid') ?? 'onXQLXhfyQv';
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const [defurn, furn, twin] = await Promise.all([
  loader.loadAsync(`/fixtures/blobs/${pid}/interior_defurnished.glb`),
  loader.loadAsync(`/fixtures/blobs/${pid}/interior.glb`).catch(() => null),
  fetch(`/fixtures/twin/${pid}.json`).then((r) => r.json()),
]);
const floorIndex = Object.fromEntries(twin.floors.map((f) => [f.floor_id, f.index]));
const data = {
  rooms: twin.rooms.map((r) => ({ room_id: r.room_id, label: r.label, floor: floorIndex[r.floor_id] })),
  sweeps: twin.sweeps.map((s) => ({ id: s.sweep_id, p: [s.position.x, s.position.y, s.position.z],
                                    room_id: s.room_id, floor: floorIndex[s.floor_id] })),
};
document.getElementById('title').textContent = `${twin.address.split(',')[0]}: defurnished`;
document.getElementById('status').remove();
unlit(defurn.scene, false);
scene.add(defurn.scene);
if (furn) { unlit(furn.scene, true); furn.scene.visible = false; scene.add(furn.scene); }
const ceilings = [];
defurn.scene.traverse((o) => { if (o.isMesh && /ceiling/.test(o.name + (o.parent?.name ?? ''))) ceilings.push(o); });

// scan points
const dots = new THREE.Group();
const dotGeo = new THREE.SphereGeometry(0.09, 16, 12);
const dotMat = new THREE.MeshBasicMaterial({ color: 0xd2642c, clippingPlanes: [clip, clipLow] });
for (const s of data.sweeps) {
  const m = new THREE.Mesh(dotGeo, dotMat);
  m.position.set(s.p[0], s.p[1] - 1.3, s.p[2]);  // on the floor below the camera
  m.userData.sweep = s;
  dots.add(m);
}
scene.add(dots);

const roomSel = document.getElementById('room');
for (const r of [...data.rooms].sort((a, b) => a.floor - b.floor || a.label.localeCompare(b.label))) {
  if (!data.sweeps.some((s) => s.room_id === r.room_id)) continue;
  const o = document.createElement('option');
  o.value = r.room_id; o.textContent = `Floor ${r.floor + 1}: ${r.label}`;
  roomSel.appendChild(o);
}

// views
const box = new THREE.Box3().setFromObject(defurn.scene);
const center = box.getCenter(new THREE.Vector3());
let mode = 'overview', current = null;
function setCeiling(on) { ceilings.forEach((c) => (c.visible = on)); document.getElementById('ceiling').classList.toggle('on', on); }
function overview() {
  mode = 'overview'; current = null;
  setCeiling(false);
  controls.enableZoom = true; controls.enablePan = true; controls.rotateSpeed = 1;
  controls.minDistance = 0.5; controls.maxDistance = 200;
  controls.target.copy(center);
  camera.position.set(center.x + 14, center.y + 22, center.z + 18);
  camera.fov = 50; camera.updateProjectionMatrix();
  dots.visible = document.getElementById('dots').classList.contains('on');
}
function stand(s, keepLook = true) {
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  if (!keepLook || mode !== 'walk') dir.set(1, 0, 0);
  dir.y = 0; dir.normalize();
  mode = 'walk'; current = s;
  setCeiling(true);
  const eye = new THREE.Vector3(...s.p);
  camera.position.copy(eye);
  controls.target.copy(eye).addScaledVector(dir, 0.01);
  controls.enableZoom = false; controls.enablePan = false; controls.rotateSpeed = -0.35;
  controls.minDistance = 0; controls.maxDistance = 0.02;
  camera.fov = 75; camera.updateProjectionMatrix();
  setFloor(String(s.floor));
  roomSel.value = s.room_id ?? '';
}
function setFloor(f) {
  const [lo, hi] = floorCut[f];
  clip.constant = hi; clipLow.constant = -lo;
  document.querySelectorAll('[data-floor]').forEach((b) => b.classList.toggle('on', b.dataset.floor === f));
}

// controls
document.getElementById('overview').onclick = overview;
document.getElementById('ceiling').onclick = () => setCeiling(!ceilings[0]?.visible);
document.getElementById('dots').onclick = (e) => { e.target.classList.toggle('on'); dots.visible = e.target.classList.contains('on'); };
document.querySelectorAll('[data-floor]').forEach((b) => (b.onclick = () => setFloor(b.dataset.floor)));
const mDef = document.getElementById('m-defurn'), mFurn = document.getElementById('m-furn');
mDef.onclick = () => { defurn.scene.visible = true; if (furn) furn.scene.visible = false; mDef.classList.add('on'); mFurn.classList.remove('on'); };
mFurn.onclick = () => { if (!furn) return; defurn.scene.visible = false; furn.scene.visible = true; mFurn.classList.add('on'); mDef.classList.remove('on'); };
roomSel.onchange = () => { const s = data.sweeps.find((x) => x.room_id === roomSel.value); if (s) stand(s, false); };
addEventListener('keydown', (e) => {
  if (mode !== 'walk' || !current || !['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  const same = data.sweeps.filter((s) => s.room_id && s.room_id === current.room_id);
  const list = same.length > 1 ? same : data.sweeps.filter((s) => s.floor === current.floor);
  const i = list.indexOf(current);
  stand(list[(i + (e.key === 'ArrowRight' ? 1 : list.length - 1)) % list.length]);
});
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => (down = [e.clientX, e.clientY]));
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4 || !dots.visible) return;
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(dots.children.filter((d) => {
    const [lo, hi] = [-clipLow.constant, clip.constant];
    return d.position.y > lo && d.position.y < hi;
  }))[0];
  if (hit) stand(hit.object.userData.sweep);
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

overview();
setFloor('all');
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
