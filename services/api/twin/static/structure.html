<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Building model</title>
<style>
  :root { --bg: #f4f1ec; --panel: rgba(255,255,255,.92); --ink: #1d1b18; --muted: #6b665e; --accent: #b4532a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.35 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #ui { position: fixed; top: 12px; left: 12px; background: var(--panel); border-radius: 10px; padding: 10px 12px;
        box-shadow: 0 2px 12px rgba(0,0,0,.12); display: grid; gap: 8px; max-width: 300px; }
  #ui h1 { font-size: 14px; margin: 0; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  button, select { font: inherit; border: 1px solid #d6d0c6; background: #fff; border-radius: 6px; padding: 4px 8px; cursor: pointer; }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  #hint { color: var(--muted); font-size: 12px; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }
</style>
</head>
<body>
<div id="ui">
  <h1 id="title">Building model</h1>
  <div class="row">
    Floor <button data-floor="0">1</button><button data-floor="1">2</button><button data-floor="all" class="on">Both</button>
  </div>
  <div class="row">
    <button id="roof" class="on">Roof</button>
    <button id="ceiling">Ceilings</button>
    <button id="scan">Overlay scan</button>
    <button id="dots">Scan points</button>
    <button id="overview">Overview</button>
  </div>
  <div class="row">
    <select id="room"><option value="">Stand in a room…</option></select>
  </div>
  <div id="hint">Overview: drag to orbit, right-drag to pan, scroll to zoom. Pick a room (or click an orange dot) to stand inside; ← → step between scan points.</div>
</div>
<div id="status">Loading…</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9e4dc);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.02, 500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0xb8ae9e, 1.6), new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xfff4e0, 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);

// Built by `python -m services.api.twin.structure build <pid>`; serve the repo root:
//   python -m http.server 8765  ->  /services/api/twin/static/structure.html?pid=<pid>
const pid = new URLSearchParams(location.search).get('pid') ?? 'onXQLXhfyQv';
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const [model, scan, twin] = await Promise.all([
  loader.loadAsync(`/fixtures/blobs/${pid}/structure.glb`),
  loader.loadAsync(`/fixtures/blobs/${pid}/interior.glb`).catch(() => null),
  fetch(`/fixtures/twin/${pid}.json`).then((r) => r.json()),
]);
document.getElementById('title').textContent = `${twin.address.split(',')[0]}: building model`;
document.getElementById('status').remove();

const parts = [];
model.scene.traverse((o) => {
  if (!o.isMesh) return;
  const name = o.name || o.parent?.name || '';
  const m = name.match(/^f(\d+)_(.*)$/);
  o.userData.floor = m ? m[1] : 'all';
  o.userData.kind = m ? m[2] : name;
  o.castShadow = !/glass|ceiling/.test(name);  // ceilings would put every room in shadow
  o.receiveShadow = true;
  if (/ceiling/.test(name)) o.material.side = THREE.DoubleSide;
  parts.push(o);
});
scene.add(model.scene);
if (scan) {
  scan.scene.traverse((o) => {
    if (!o.isMesh) return;
    const map = o.material.map;
    o.material = new THREE.MeshBasicMaterial({ map, transparent: true, opacity: 0.45, depthWrite: false, side: THREE.DoubleSide });
    if (map) map.colorSpace = THREE.SRGBColorSpace;
  });
  scan.scene.visible = false;
  scene.add(scan.scene);
}

const box = new THREE.Box3().setFromObject(model.scene);
const center = box.getCenter(new THREE.Vector3());
const size = box.getSize(new THREE.Vector3()).length();
sun.position.set(center.x + size * 0.4, center.y + size * 0.6, center.z + size * 0.3);
sun.target.position.copy(center);
Object.assign(sun.shadow.camera, { left: -size / 2, right: size / 2, top: size / 2, bottom: -size / 2, near: 0.1, far: size * 2 });
sun.shadow.camera.updateProjectionMatrix();

const floorIndex = Object.fromEntries(twin.floors.map((f) => [f.floor_id, String(f.index)]));
const sweeps = twin.sweeps.map((s) => ({ id: s.sweep_id, p: [s.position.x, s.position.y, s.position.z],
                                          room_id: s.room_id, floor: floorIndex[s.floor_id] }));
const dots = new THREE.Group();
const dotGeo = new THREE.SphereGeometry(0.09, 16, 12);
const dotMat = new THREE.MeshBasicMaterial({ color: 0xd2642c });
for (const s of sweeps) {
  const m = new THREE.Mesh(dotGeo, dotMat);
  m.position.set(s.p[0], s.p[1] - 1.3, s.p[2]);
  m.userData.sweep = s;
  dots.add(m);
}
dots.visible = false;
scene.add(dots);

const roomSel = document.getElementById('room');
for (const r of [...twin.rooms].sort((a, b) => floorIndex[a.floor_id] - floorIndex[b.floor_id] || a.label.localeCompare(b.label))) {
  if (!sweeps.some((s) => s.room_id === r.room_id)) continue;
  const o = document.createElement('option');
  o.value = r.room_id; o.textContent = `Floor ${Number(floorIndex[r.floor_id]) + 1}: ${r.label}`;
  roomSel.appendChild(o);
}

let floor = 'all', ceilings = false, roof = true, mode = 'overview', current = null;
function refresh() {
  for (const o of parts) {
    const onFloor = floor === 'all' || o.userData.floor === floor;
    o.visible = onFloor && (ceilings || o.userData.kind !== 'ceiling') && (roof || o.userData.kind !== 'roof');
    // looking at one floor from above: hide the floor over it
    if (floor !== 'all' && Number(o.userData.floor) > Number(floor)) o.visible = false;
  }
  for (const d of dots.children) d.visible = floor === 'all' || d.userData.sweep.floor === floor;
  document.querySelectorAll('[data-floor]').forEach((b) => b.classList.toggle('on', b.dataset.floor === floor));
  document.getElementById('ceiling').classList.toggle('on', ceilings);
  document.getElementById('roof').classList.toggle('on', roof);
}
function overview() {
  mode = 'overview'; current = null; ceilings = false;
  controls.enableZoom = true; controls.enablePan = true; controls.rotateSpeed = 1;
  controls.minDistance = 0.5; controls.maxDistance = 200;
  controls.target.copy(center);
  camera.position.set(center.x + 14, center.y + 22, center.z + 18);
  camera.fov = 50; camera.updateProjectionMatrix();
  refresh();
}
function stand(s, keepLook = true) {
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  if (!keepLook || mode !== 'walk') dir.set(1, 0, 0);
  dir.y = 0; dir.normalize();
  mode = 'walk'; current = s; ceilings = true; floor = s.floor;
  const eye = new THREE.Vector3(...s.p);
  camera.position.copy(eye);
  controls.target.copy(eye).addScaledVector(dir, 0.01);
  controls.enableZoom = false; controls.enablePan = false; controls.rotateSpeed = -0.35;
  controls.minDistance = 0; controls.maxDistance = 0.02;
  camera.fov = 75; camera.updateProjectionMatrix();
  roomSel.value = s.room_id ?? '';
  refresh();
}

document.getElementById('overview').onclick = overview;
document.getElementById('ceiling').onclick = () => { ceilings = !ceilings; refresh(); };
document.getElementById('roof').onclick = () => { roof = !roof; refresh(); };
document.getElementById('scan').onclick = (e) => {
  if (!scan) return;
  scan.scene.visible = !scan.scene.visible;
  e.target.classList.toggle('on', scan.scene.visible);
};
document.getElementById('dots').onclick = (e) => { dots.visible = !dots.visible; e.target.classList.toggle('on', dots.visible); refresh(); };
document.querySelectorAll('[data-floor]').forEach((b) => (b.onclick = () => { floor = b.dataset.floor; refresh(); }));
roomSel.onchange = () => { const s = sweeps.find((x) => x.room_id === roomSel.value); if (s) stand(s, false); };
addEventListener('keydown', (e) => {
  if (mode !== 'walk' || !current || !['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  const same = sweeps.filter((s) => s.room_id && s.room_id === current.room_id);
  const list = same.length > 1 ? same : sweeps.filter((s) => s.floor === current.floor);
  const i = list.indexOf(current);
  stand(list[(i + (e.key === 'ArrowRight' ? 1 : list.length - 1)) % list.length]);
});
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => (down = [e.clientX, e.clientY]));
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4 || !dots.visible) return;
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(dots.children.filter((d) => d.visible))[0];
  if (hit) stand(hit.object.userData.sweep);
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

window.viewer = { camera, controls, sweeps, stand, overview };
overview();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
